<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{{ business.name }}{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
</head>
<body>

 
    <div class="navbar">
        <div>
            <strong>{{ business.name }}</strong>
        </div>

        <div>
            <a href="{{ url_for('business.business_home', slug=business.slug) }}">Home</a>

            {% if user %}
                <a href="{{ url_for('business.user_dashboard', slug=business.slug) }}">Dashboard</a>
                <a href="{{ url_for('business.logout', slug=business.slug) }}">Logout</a>
            {% else %}
                <a href="{{ url_for('business.user_login', slug=business.slug) }}">Login</a>
                <a href="{{ url_for('business.user_signup', slug=business.slug) }}">Signup</a>
            {% endif %}
        </div>
    </div>

   
    <div class="container">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
