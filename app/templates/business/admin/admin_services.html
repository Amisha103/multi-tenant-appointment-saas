<!DOCTYPE html>
<html>
<head>
    <title>Select Services</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f5f7fb;
            margin:0;
            padding:40px;
        }

        .container{
            max-width:1000px;
            margin:auto;
        }

        h2{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }

        .services-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
        }

        .service-card{
            background:white;
            border-radius:10px;
            padding:20px;
            box-shadow:0 4px 10px rgba(0,0,0,0.05);
            display:flex;
            align-items:center;
            transition:0.2s;
            cursor:pointer;
        }

        .service-card:hover{
            transform:translateY(-4px);
            box-shadow:0 6px 14px rgba(0,0,0,0.1);
        }

        .service-card input{
            margin-right:12px;
            width:18px;
            height:18px;
        }

        .service-name{
            font-size:16px;
            color:#444;
        }

        .submit-btn{
            margin-top:30px;
            display:block;
            width:200px;
            margin-left:auto;
            margin-right:auto;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#4f46e5;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.2s;
        }

        .submit-btn:hover{
            background:#4338ca;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Select Services</h2>

    <form method="POST">

        <div class="services-grid">

            {% for service in master_services %}

            <label class="service-card">

                <input type="checkbox"
                       name="services"
                       value="{{ service.id }}">

                <span class="service-name">
                    {{ service.name }}
                </span>

            </label>

            {% endfor %}

        </div>

        <button type="submit" class="submit-btn">
            Save Services
        </button>

    </form>

</div>

</body>
</html>
