<!DOCTYPE html>
<html>
<head>
    <title>Validating Staff</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/staff.css') }}">
</head>

<body class="auth-page">

<div class="auth-card">

    <h2>Verify Your Account</h2>
    <p class="auth-subtitle">Enter your details to continue</p>

    <form method="POST" class="auth-form">
        <input type="email" name="email" placeholder="Enter Email" required>
        <input type="number" name="staff_id" placeholder="Enter Staff ID" required>

        <button type="submit">Continue</button>
    </form>

</div>

</body>
</html>
