<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% if business %}
            {{ business.name }} | Appointments
        {% else %}
            Business Portal
        {% endif %}
    </title>

    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

   
    <link rel="stylesheet" href="{{ url_for('static', filename='css/business.css') }}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>


    <header class="business-navbar">
        <div class="nav-left">
            <a href="{{ url_for('landing.home') }}" class="logo">
                ⬅ Back to Home
            </a>
        </div>

        <div class="nav-right">
            {% if business %}
                <span class="business-name">{{ business.name }}</span>
            {% endif %}
        </div>
    </header>

 
    <main class="business-container">
        {% block content %}{% endblock %}
    </main>

  
    <footer class="business-footer">
        <p>© {{ business.name if business else "Business Portal" }} · All rights reserved</p>
    </footer>

</body>
</html>
