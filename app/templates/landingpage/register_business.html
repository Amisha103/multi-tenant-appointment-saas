{% extends "landingpage/base.html" %}

{% block content %}

<section class="form-section">

    <h2>Register Your Business</h2>
    <p>Join our platform and start accepting appointments online.</p>

    <!-- Google Sign In -->
    <div class="google-signin-container">

        <div
            id="g_id_onload"
            data-client_id="{{ google_client_id }}"
            data-context="signup"
            data-callback="handleGoogleSignup"
            data-auto_prompt="false">
        </div>

        <div
            class="g_id_signin"
            data-type="standard"
            data-theme="outline"
            data-size="large"
            data-shape="pill"
            data-text="signup_with"
            data-logo_alignment="left">
        </div>

    </div>

    <div class="divider">
        <span>──────── OR ────────</span>
    </div>

    <form
        class="business-form"
        method="POST"
        action="{{ url_for('landing.register_business') }}">

        <!-- Hidden Fields -->

        <input
            type="hidden"
            id="google_id"
            name="google_id">

        <input
            type="hidden"
            id="auth_provider"
            name="auth_provider"
            value="local">

        <!-- Business Name -->

        <div class="form-group">

            <label>Business Name</label>

            <input
                type="text"
                id="business_name"
                name="business_name"
                required>

        </div>

        <!-- Owner Name -->

        <div class="form-group">

            <label>Owner Name</label>

            <input
                type="text"
                id="owner_name"
                name="owner_name"
                required>

        </div>

        <!-- Email -->

        <div class="form-group">

            <label>Business Email</label>

            <input
                type="email"
                id="email"
                name="email"
                required>

        </div>

        <!-- Password -->

        <div
            class="form-group"
            id="password-group">

            <label>Create Password</label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="6"
                required>

            <small class="hint">
                Minimum 6 characters.
            </small>

        </div>

        <!-- Phone -->

        <div class="form-group">

            <label>Contact Number</label>

            <input
                type="text"
                id="phone"
                name="phone"
                required>

        </div>

        <!-- GST -->

        <div class="form-group">

            <label>GST Number</label>

            <input
                type="text"
                id="gst_number"
                name="gst_number"
                required>

            <small class="hint">
                GST number must be valid.
            </small>

        </div>

        <!-- Address -->

        <div class="form-group">

            <label>Business Address</label>

            <textarea
                id="address"
                name="address"
                rows="3"
                required></textarea>

        </div>

        <!-- Category -->

        <div class="form-group">

            <label>Business Category</label>

            <select
                id="category"
                name="category"
                required>

                <option value="">Select Category</option>
                <option value="healthcare">Healthcare</option>
                <option value="salon">Salon</option>
                <option value="fitness">Fitness</option>
                <option value="education">Education</option>
                <option value="other">Other</option>

            </select>

        </div>

        <button
            id="registerBtn"
            type="submit"
            class="btn-primary">

            Register Business

        </button>

    </form>

</section>

<script
src="https://accounts.google.com/gsi/client"
async
defer>
</script>

<script>

async function handleGoogleSignup(response){

    try{

        const res = await fetch("{{ url_for('landing.verify_google') }}", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                credential: response.credential
            })

        });

        const data = await res.json();

        console.log("Google Response:", data);

        if (!res.ok || !data.success){

            alert(data.message || "Google Sign-In Failed");

            return;

        }

        // Fill Google details

        document.getElementById("owner_name").value = data.name;
        document.getElementById("email").value = data.email;

        // Hidden fields

        document.getElementById("google_id").value = data.google_id;
        document.getElementById("auth_provider").value = "google";

        // Make fields readonly

        document.getElementById("owner_name").readOnly = true;
        document.getElementById("email").readOnly = true;

        // Hide password section

        document.getElementById("password-group").style.display = "none";

        // Disable password

        document.getElementById("password").disabled = true;
        document.getElementById("password").required = false;

        // Focus next field

        document.getElementById("business_name").focus();

        alert(
            "Google account verified successfully.\n\nPlease complete the remaining business details."
        );

    }

    catch(err){

        console.error(err);

        alert("Unable to verify Google account.");

    }

}

</script>

{% endblock %}
